[versions]
agp = "8.7.3"
junit = "5.11.3"
# The Android platform's own org.json (AOSP), packaged for the JVM. The pure core compiles
# and tests against exactly the classes the phone provides at runtime.
androidJson = "0.0.20131108.vaadin1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
android-json = { module = "com.vaadin.external.google:android-json", version.ref = "androidJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
