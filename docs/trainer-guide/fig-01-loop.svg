<text x="672.5" y="84.0" font-size="12" fill="#5d6470" text-anchor="middle" font-weight="normal" >the pump does</text>
<text x="672.5" y="101.0" font-size="12" fill="#5d6470" text-anchor="middle" font-weight="normal" >what it says</text>
<rect x="470.0" y="200.0" width="190.0" height="80.0" rx="8" fill="#ffffff" stroke="#d9d4ca" />
<text x="565.0" y="224.0" font-size="14" fill="#1c1e22" text-anchor="middle" font-weight="600" >The session, filed</text>
<text x="565.0" y="244.0" font-size="12" fill="#5d6470" text-anchor="middle" font-weight="normal" >what ran, and the</text>
<text x="565.0" y="261.0" font-size="12" fill="#5d6470" text-anchor="middle" font-weight="normal" >minutes at pressure</text>
<rect x="245.0" y="200.0" width="190.0" height="80.0" rx="8" fill="#ffffff" stroke="#d9d4ca" />
<text x="340.0" y="224.0" font-size="14" fill="#1c1e22" text-anchor="middle" font-weight="600" >Your readings</text>
<text x="340.0" y="244.0" font-size="12" fill="#5d6470" text-anchor="middle" font-weight="normal" >baseline and after,</text>
<text x="340.0" y="261.0" font-size="12" fill="#5d6470" text-anchor="middle" font-weight="normal" >when the app asks</text>
<line x1="170.0" y1="80.0" x2="213.0" y2="80.0" stroke="#5d6470" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="365.0" y1="80.0" x2="408.0" y2="80.0" stroke="#5d6470" stroke-width="1.2" marker-end="url(#arr)"/>
