<line x1="470.0" y1="240.0" x2="437.0" y2="240.0" stroke="#5d6470" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M245,240 L150,240 L150,160 L290,160 L290,122" fill="none" stroke="#1d5bb8" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="158.0" y="176.0" font-size="12" fill="#1d5bb8" text-anchor="start" font-weight="600" >read back</text>
<rect x="20.0" y="292.0" width="720.0" height="28.0" rx="6" fill="#eef3fb" stroke="none" />
<text x="380.0" y="311.0" font-size="12" fill="#1c1e22" text-anchor="middle" font-weight="normal" >Where the plan reads back:  1 no data, it holds   ·   2 a week that doesn't count never blocks   ·   3 every “didn't count” says why</text>
<text x="20.0" y="24.0" font-size="13" fill="#5d6470" text-anchor="start" font-weight="600" >The trainer's loop</text>
