name: New pump request
description: Help add support for another pump
labels: [new-pump]
body:
  - type: markdown
    attributes:
      value: "Thank you! Tell us about the pump and how you can help. See docs/adding-a-pump.md."
  - type: input
    id: model
    attributes:
      label: Make and model
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name it advertises over Bluetooth
  - type: textarea
    id: testing
    attributes:
      label: Can you help test?
      description: "Would you run test builds on the bench? Do you have a rigid, sealed container such as a cylinder, or a vacuum gauge? Please leave out your pump's Bluetooth address and serial number."
  - type: textarea
    id: telemetry
    attributes:
      label: Does it report pressure back? How often?
