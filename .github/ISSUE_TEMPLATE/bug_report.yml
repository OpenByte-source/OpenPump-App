name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Safety problem?** (pressure above the ceiling, a stop that does not vent, a run that will not stop) — do not report it here. Follow SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings › Device & developer › This build
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
    validations:
      required: true
  - type: input
    id: pump
    attributes:
      label: Pump model (or "simulated pump")
