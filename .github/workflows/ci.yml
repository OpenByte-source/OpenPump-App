name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the build number is 1000 + the commit count

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK with ANDROID_HOME set. The setup-android
      # action's licence step hangs on newer cmdline-tools, so accept licences directly;
      # AGP then fetches the platform and build-tools it needs.
      - name: Accept Android SDK licences
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # v5, not v6: both run on Node 24, but v6 moved caching into a separately licensed
      # component whose terms the project has not accepted.
      - uses: gradle/actions/setup-gradle@v5

      - name: Tests (harnesses + JUnit)
        run: ./gradlew test --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Lint report
        run: ./gradlew :app:lintDebug --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: openpump-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
