name: Release

# Builds, signs and publishes a release APK when a version tag is pushed.
#
# The signing key lives only in the protected `release` environment, which needs a
# reviewer's approval before this job starts, so a workflow from a fork or a branch can
# never read it. How the key is made and uploaded: docs/release.md.

on:
  push:
    tags: ['v*.*.*']
  # A manual re-run: choose the tag (not a branch) under "Use workflow from". The
  # environment only admits version tags, so a run from a branch never gets the key.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Started from a version tag
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::Run this from a version tag, not a branch (got ${{ github.ref }})"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the build number is 1000 + the commit count

      - name: Tag matches versionName
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! grep -Eq "versionName = \"${VERSION//./\\.}\"" app/build.gradle.kts; then
            echo "::error::Tag $TAG does not match versionName in app/build.gradle.kts"
            grep -n 'versionName' app/build.gradle.kts || true
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing from the 'release' environment"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Same as ci.yml: the runner image ships the Android SDK; accept its licences directly.
      - name: Accept Android SDK licences
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # v5, not v6: see the note in ci.yml.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Tests (harnesses + JUnit)
        run: ./gradlew test --console=plain

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/openpump-release.jks"
          # Tolerates certutil's BEGIN/END lines and Windows line endings.
          printf '%s\n' "$KEYSTORE_BASE64" | tr -d '\r' | grep -v '^-----' | tr -d '\n ' \
            | base64 --decode > "$KEYSTORE"
          [ -s "$KEYSTORE" ] || { echo "::error::Decoded keystore is empty"; exit 1; }
          echo "OPENPUMP_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          OPENPUMP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OPENPUMP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OPENPUMP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify the signature, name the APK, write its checksum
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed APK at $APK — the build fell back to unsigned"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          # The project's key, and no other: the fingerprint the README publishes. A release
          # signed with anything else could never update the installs already out there.
          EXPECTED_CERT=a277b68a88aacec9d9137e492eddd2b141d03756f0c7143d441e082ae843402d
          if ! grep -qi "certificate SHA-256 digest: $EXPECTED_CERT" apksigner.txt; then
            echo "::error::The APK is not signed with the OpenPump release key ($EXPECTED_CERT)"
            exit 1
          fi
          # Debug-only code stays out of the published APK: the diagnostic console sends raw frames
          # outside every safety check, and the simulator's lost-stop hook drops StopWork on
          # purpose. The release's permissions are pinned below. The manifest and the dex
          # are written to files before grep reads them: `producer | grep -q` under pipefail
          # passes when grep exits early and the producer dies of SIGPIPE.
          CHECK="$(mktemp -d)"
          "$BUILD_TOOLS/aapt2" dump xmltree "$APK" --file AndroidManifest.xml > "$CHECK/manifest.txt"
          if grep -q "MainActivity" "$CHECK/manifest.txt"; then
            echo "::error::The release manifest declares the diagnostic console (MainActivity)"
            exit 1
          fi
          # The permissions, pinned. INTERNET and ACCESS_NETWORK_STATE are the optional
          # GrowthTrack connection (docs/adr/0010-optional-growthtrack-connection.md); every
          # other one is the pump, the camera, notifications and the run service. A permission
          # that is not on this list fails the release, so nothing network-ish (Wi-Fi state,
          # nearby devices, accounts, an SDK's own additions) arrives by a dependency bump or a
          # manifest merge without someone changing this list in review.
          ALLOWED_PERMISSIONS='
          android.permission.ACCESS_COARSE_LOCATION
          android.permission.ACCESS_FINE_LOCATION
          android.permission.ACCESS_NETWORK_STATE
          android.permission.BLUETOOTH
          android.permission.BLUETOOTH_ADMIN
          android.permission.BLUETOOTH_CONNECT
          android.permission.BLUETOOTH_SCAN
          android.permission.CAMERA
          android.permission.FOREGROUND_SERVICE
          android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE
          android.permission.INTERNET
          android.permission.POST_NOTIFICATIONS
          android.permission.RECEIVE_BOOT_COMPLETED
          android.permission.SCHEDULE_EXACT_ALARM
          android.permission.USE_BIOMETRIC
          android.permission.VIBRATE
          android.permission.WAKE_LOCK
          '
          printf '%s\n' $ALLOWED_PERMISSIONS | sort -u > "$CHECK/allowed.txt"
          # Every <uses-permission> and <uses-permission-sdk-23>, by its android:name.
          awk '
            /^[[:space:]]*E: / { inperm = ($2 == "uses-permission" || $2 == "uses-permission-sdk-23"); next }
            inperm && /android:name\(/ { s = $0; sub(/.*android:name\([^)]*\)="/, "", s); sub(/".*/, "", s); print s; inperm = 0 }
          ' "$CHECK/manifest.txt" | sort -u > "$CHECK/permissions.txt"
          if [ ! -s "$CHECK/permissions.txt" ]; then
            echo "::error::Read no permissions from the release manifest; the check itself is broken"
            exit 1
          fi
          comm -23 "$CHECK/permissions.txt" "$CHECK/allowed.txt" > "$CHECK/extra.txt"
          if [ -s "$CHECK/extra.txt" ]; then
            while read -r PERM; do
              echo "::error::The release manifest asks for $PERM, which is not on the pinned list"
            done < "$CHECK/extra.txt"
            exit 1
          fi
          comm -13 "$CHECK/permissions.txt" "$CHECK/allowed.txt" > "$CHECK/gone.txt"
          while read -r PERM; do
            echo "::warning::$PERM is on the pinned list but no longer in the manifest; take it off the list"
          done < "$CHECK/gone.txt"
          # HTTPS only: the GrowthTrack connection never needs cleartext, and the debug
          # console's cleartext log upload must not reach a release.
          if ! grep -q 'android:usesCleartextTraffic([^)]*)=false' "$CHECK/manifest.txt"; then
            echo "::error::The release manifest does not forbid cleartext traffic"
            exit 1
          fi
          mkdir -p "$CHECK/dex"
          unzip -q -o "$APK" 'classes*.dex' -d "$CHECK/dex"
          for NEEDLE in 'Lorg/openpump/MainActivity;' 'Lorg/openpump/SimStopLoss;' 'sim-lose-next-stop'; do
            if grep -aq -- "$NEEDLE" "$CHECK"/dex/*.dex; then
              echo "::error::The release APK contains debug-only code ($NEEDLE)"
              exit 1
            fi
          done
          rm -rf "$CHECK"
          mkdir -p dist
          OUT="dist/OpenPump-$VERSION.apk"
          cp "$APK" "$OUT"
          (cd dist && sha256sum "OpenPump-$VERSION.apk" > "OpenPump-$VERSION.apk.sha256")
          cat "dist/OpenPump-$VERSION.apk.sha256"

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          # The section whose heading starts "## [0.9.0]" or "## 0.9.0", up to the next "## ".
          awk -v v="$VERSION" '
            /^## / {
              if (found) exit
              h = $0; sub(/^## \[?/, "", h)
              if (index(h, v) == 1 && substr(h, length(v) + 1, 1) !~ /[0-9.]/) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ -s dist/notes.md ] && grep -q '[^[:space:]]' dist/notes.md; then
            echo "NOTES_FLAG=--notes-file dist/notes.md" >> "$GITHUB_ENV"
          else
            echo "No CHANGELOG section for $VERSION; using generated notes."
            echo "NOTES_FLAG=--generate-notes" >> "$GITHUB_ENV"
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # NOTES_FLAG is two words on purpose
          gh release create "$TAG" \
            --verify-tag \
            --title "OpenPump $VERSION" \
            $NOTES_FLAG \
            "dist/OpenPump-$VERSION.apk" \
            "dist/OpenPump-$VERSION.apk.sha256"

      - name: Delete the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/openpump-release.jks"
